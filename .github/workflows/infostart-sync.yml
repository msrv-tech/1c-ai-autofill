name: Sync with Infostart

on:
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload even if versions match'
        type: boolean
        default: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sync UNF_Rozn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFOSTART_URL: ${{ secrets.INFOSTART_URL_UNF }}
          FORCE_UPLOAD: ${{ github.event.inputs.force_upload }}
        run: |
          if [ -z "$INFOSTART_URL" ]; then
            echo "INFOSTART_URL_UNF is not set. Skipping."
            exit 0
          fi

          LATEST_TAG=$(gh release list --limit 50 --json tagName,createdAt \
            --jq '.[] | select(.tagName|startswith("UNF_Rozn_")) | .tagName' | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No UNF_Rozn release found."
            exit 0
          fi

          VERSION="${LATEST_TAG#UNF_Rozn_}"
          echo "Latest UNF_Rozn release tag: $LATEST_TAG (Version: $VERSION)"

          mkdir -p dist/unf
          gh release download "$LATEST_TAG" --pattern "*.cfe" --dir dist/unf --clobber

          CFE_FILE=$(ls dist/unf/*.cfe 2>/dev/null | head -n 1)

          if [ -z "$CFE_FILE" ]; then
            echo "CFE file not found."
            exit 1
          fi

          FORCE_OPT=""
          if [ "$FORCE_UPLOAD" = "true" ]; then
            FORCE_OPT="--force"
          fi

          python automation/infostart_updater.py \
            --url "$INFOSTART_URL" \
            --file "$CFE_FILE" \
            --version "$VERSION" \
            $FORCE_OPT

      - name: Sync UT_KA_ERP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFOSTART_URL: ${{ secrets.INFOSTART_URL_UT }}
          FORCE_UPLOAD: ${{ github.event.inputs.force_upload }}
        run: |
          if [ -z "$INFOSTART_URL" ]; then
            echo "INFOSTART_URL_UT is not set. Skipping."
            exit 0
          fi

          LATEST_TAG=$(gh release list --limit 50 --json tagName,createdAt \
            --jq '.[] | select(.tagName|startswith("UT_KA_ERP_")) | .tagName' | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No UT_KA_ERP release found."
            exit 0
          fi

          VERSION="${LATEST_TAG#UT_KA_ERP_}"
          echo "Latest UT_KA_ERP release tag: $LATEST_TAG (Version: $VERSION)"

          mkdir -p dist/ut
          gh release download "$LATEST_TAG" --pattern "*.cfe" --dir dist/ut --clobber

          CFE_FILE=$(ls dist/ut/*.cfe 2>/dev/null | head -n 1)

          if [ -z "$CFE_FILE" ]; then
            echo "CFE file not found."
            exit 1
          fi

          FORCE_OPT=""
          if [ "$FORCE_UPLOAD" = "true" ]; then
            FORCE_OPT="--force"
          fi

          python automation/infostart_updater.py \
            --url "$INFOSTART_URL" \
            --file "$CFE_FILE" \
            --version "$VERSION" \
            $FORCE_OPT
