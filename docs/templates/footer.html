<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 0; font-size: 9pt; font-family: "Segoe UI", sans-serif; }
#footer-content { text-align: center; }
</style>
<script>
function subst() {
  var vars = {};
  var q = window.location.search.substring(1).split('&');
  for (var i = 0; i < q.length; i++) {
    var z = q[i].split('=', 2);
    vars[z[0]] = decodeURIComponent((z[1] || '').replace(/\+/g, ' '));
  }
  var page = vars['page'] || '1';
  var topage = vars['topage'] || '1';
  var year = 'YEAR_PLACEHOLDER';
  var content = document.getElementById('footer-content');
  if (parseInt(page, 10) === 1) {
    content.textContent = year;
  } else {
    content.textContent = 'Стр. ' + page + ' из ' + topage;
  }
}
</script>
</head>
<body onload="subst()">
<div id="footer-content">—</div>
</body>
</html>
